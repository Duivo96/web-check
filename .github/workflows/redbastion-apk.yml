name: Red Bastion APK Build

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.apkbuild/**'
      - '.github/workflows/redbastion-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled web app
        run: |
          mkdir -p .apkbuild/app/src/main/assets
          cat .apkbuild/html_parts/part-* | base64 --decode | gzip --decompress > .apkbuild/app/src/main/assets/index.html
          curl -fsSL https://unpkg.com/three@0.128.0/build/three.min.js -o .apkbuild/app/src/main/assets/three.min.js
          test -s .apkbuild/app/src/main/assets/index.html
          test -s .apkbuild/app/src/main/assets/three.min.js
      - name: Build debug APK
        working-directory: .apkbuild
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp .apkbuild/app/build/outputs/apk/debug/app-debug.apk RedBastion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedBastion-APK
          path: RedBastion.apk
          if-no-files-found: error
